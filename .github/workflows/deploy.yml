name: CI/CD for One-FM Frappe App (Dockerized)

on:
  push:
    branches:
      - staging

jobs:
  build-test-deploy:
    name: Build, Test & Deploy (Docker)
    runs-on: ubuntu-latest

    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PATH: ${{ secrets.STAGING_PATH }}
      EMAIL_TO: mamahmarcus792@gmail.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run containerized tests
      run: |
        chmod +x scripts/run_tests.sh
        bash scripts/run_tests.sh

    - name: Copy project files to staging server
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        source: "./*"
        target: ${{ secrets.STAGING_PATH }}

    - name: Deploy via Docker Compose on server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd ${{ secrets.STAGING_PATH }}
          docker compose down
          docker compose up -d --build

    - name: Notify team on success
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "✅ One-FM App Deployed to Staging"
        to: ${{ env.EMAIL_TO }}
        from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
        body: |
          Deployment to staging succeeded.

    - name: Notify team on failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ One-FM App Deployment Failed"
        to: ${{ env.EMAIL_TO }}
        from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
        body: |
          Deployment failed during CI/CD. Check GitHub Actions logs for more info.
